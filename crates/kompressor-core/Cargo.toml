[package]
name = "kompressor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared spine for every OptScale Kompressor surface: configuration, tenant resolution, and the compress/retrieve operations themselves."

[features]
default = ["code-aware"]
code-aware = ["kompressor-engine/code-aware"]
# W3C trace-context in and out (see `trace_ctx`). Without it those functions
# are empty; with it the opentelemetry crates are linked.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
]

[dependencies]
blake2 = { workspace = true }
kompressor-engine = { path = "../kompressor-engine", default-features = false }
kompressor-store = { path = "../kompressor-store" }
kompressor-stats = { path = "../kompressor-stats" }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
humantime-serde = { workspace = true }
thiserror = { workspace = true }
# `sync` only: the engine permit every surface shares lives on `AppCore`.
tokio = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
url = { workspace = true }
# The backup archive: database snapshots, tarred and gzipped.
tar = { workspace = true }
flate2 = { workspace = true }
# SHA-256 of each scheduled archive, written beside it (`sha256sum -c`).
ring = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
